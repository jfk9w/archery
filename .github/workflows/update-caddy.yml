name: Update Caddy

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-caddy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update eligible Caddy release
        id: update
        run: ./scripts/update-caddy packages/caddy/PKGBUILD

      - name: Commit patch or minor update to main
        if: steps.update.outputs.updated == 'true' && steps.update.outputs.kind != 'major'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.update.outputs.version }}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/caddy/PKGBUILD
          git commit -m "Update Caddy to ${version}"
          git push origin HEAD:main
          gh workflow run build.yml --ref main

      - name: Open major update pull request
        if: steps.update.outputs.updated == 'true' && steps.update.outputs.kind == 'major'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.update.outputs.version }}
          branch="update-caddy-v${version}"

          if gh pr list --head "$branch" --state open --json number --jq 'length > 0' | grep -Fx true; then
            echo "Pull request for Caddy ${version} already exists"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --create "$branch"
          git add packages/caddy/PKGBUILD
          git commit -m "Update Caddy to ${version}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update Caddy to ${version}" \
            --body "Automated major Caddy update after a 30-day cooling period. This pull request requires a manual merge."
