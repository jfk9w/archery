name: Build and publish packages

on:
  push:
    paths:
      - packages/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  amneziawg-linux-lts:
    outputs:
      rebuilt: ${{ steps.result.outputs.rebuilt }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install package selection tools
        run: pacman -Sy --noconfirm --needed curl gnupg

      - uses: actions/checkout@v4

      - name: Select current linux-lts
        run: ./scripts/prepare-linux-lts packages/amneziawg-linux-lts/PKGBUILD

      - name: Reuse published package
        id: reuse
        if: github.event_name == 'schedule'
        run: |
          if ./scripts/reuse-published-package packages/amneziawg-linux-lts; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build environment
        if: steps.reuse.outputs.reused != 'true'
        run: pacman -Su --noconfirm --needed bc git kmod linux-lts linux-lts-headers

      - name: Build package
        if: steps.reuse.outputs.reused != 'true'
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc \
            "cd '$GITHUB_WORKSPACE/packages/amneziawg-linux-lts' && makepkg --cleanbuild --noconfirm"

      - name: Record build result
        id: result
        run: echo "rebuilt=${{ steps.reuse.outputs.reused != 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Verify module metadata
        if: steps.reuse.outputs.reused != 'true'
        run: |
          package=$(find packages/amneziawg-linux-lts -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          mkdir /tmp/package
          bsdtar -xf "$package" -C /tmp/package
          module=$(find /tmp/package/usr/lib/modules -name 'amneziawg.ko.zst' -print -quit)
          zstd -dc "$module" > /tmp/amneziawg.ko
          modinfo /tmp/amneziawg.ko

      - uses: actions/upload-artifact@v4
        with:
          name: amneziawg-linux-lts
          path: packages/amneziawg-linux-lts/*.pkg.tar.zst
          if-no-files-found: error

  nvidia-open-lts-meta:
    outputs:
      rebuilt: ${{ steps.result.outputs.rebuilt }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install package selection tools
        run: pacman -Sy --noconfirm --needed curl gnupg

      - uses: actions/checkout@v4

      - name: Select matching official NVIDIA driver and linux-lts
        run: ./scripts/prepare-nvidia-open-lts-meta packages/nvidia-open-lts-meta/PKGBUILD

      - name: Reuse published package
        id: reuse
        if: github.event_name == 'schedule'
        run: |
          if ./scripts/reuse-published-package packages/nvidia-open-lts-meta; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.reuse.outputs.reused != 'true'
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc \
            "cd '$GITHUB_WORKSPACE/packages/nvidia-open-lts-meta' && makepkg --nodeps --cleanbuild --noconfirm"

      - name: Record build result
        id: result
        run: echo "rebuilt=${{ steps.reuse.outputs.reused != 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Verify pinned dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: |
          package=$(find packages/nvidia-open-lts-meta -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          bsdtar -xOf "$package" .PKGINFO | grep -E '^depend = (linux-lts|nvidia-open-lts)='

      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-open-lts-meta
          path: packages/nvidia-open-lts-meta/*.pkg.tar.zst
          if-no-files-found: error

  caddy:
    outputs:
      rebuilt: ${{ steps.result.outputs.rebuilt }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install package selection tools
        run: pacman -Sy --noconfirm --needed curl git gnupg

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust checked out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select package timestamp
        run: ./scripts/prepare-caddy packages/caddy/PKGBUILD

      - name: Reuse published package
        id: reuse
        if: github.event_name == 'schedule'
        run: |
          if ./scripts/reuse-published-package packages/caddy; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install build environment
        if: steps.reuse.outputs.reused != 'true'
        run: pacman -Su --noconfirm --needed go mailcap

      - name: Build package
        if: steps.reuse.outputs.reused != 'true'
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc \
            "cd '$GITHUB_WORKSPACE/packages/caddy' && makepkg --cleanbuild --noconfirm"

      - name: Record build result
        id: result
        run: echo "rebuilt=${{ steps.reuse.outputs.reused != 'true' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: caddy
          path: packages/caddy/*.pkg.tar.zst
          if-no-files-found: error

  repository:
    needs: [amneziawg-linux-lts, nvidia-open-lts-meta, caddy]
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install repository tools
        run: pacman -Syu --noconfirm --needed gnupg

      - uses: actions/download-artifact@v5
        with:
          pattern: '*'
          path: packages
          merge-multiple: true

      - name: Import repository signing key
        env:
          ARCHERY_GPG_PRIVATE_KEY: ${{ secrets.ARCHERY_GPG_PRIVATE_KEY }}
        run: |
          test -n "$ARCHERY_GPG_PRIVATE_KEY"
          printf '%s' "$ARCHERY_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

      - name: Assemble signed repository
        run: |
          install -d public/x86_64
          cp packages/*.pkg.tar.zst public/x86_64/

          fingerprint=$(gpg --batch --with-colons --list-secret-keys | \
            awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"

          cd public/x86_64
          for package in *.pkg.tar.zst; do
            gpg --batch --yes --local-user "$fingerprint" --detach-sign "$package"
          done
          repo-add --sign --key "$fingerprint" archery.db.tar.zst ./*.pkg.tar.zst

          # GitHub Pages artifacts cannot contain symbolic links. repo-add creates
          # archery.db and archery.files as symlinks, so publish regular copies.
          while IFS= read -r link; do
            cp --dereference "$link" "${link}.regular"
            rm "$link"
            mv "${link}.regular" "$link"
          done < <(find . -maxdepth 1 -type l -print)

          gpg --batch --armor --export "$fingerprint" > ../archery.gpg
          printf '%s\n' "$fingerprint" > ../archery.fingerprint

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [amneziawg-linux-lts, nvidia-open-lts-meta, caddy, deploy]
    if: >-
      vars.ENABLE_EMAIL_NOTIFICATIONS == 'true' &&
      (needs['amneziawg-linux-lts'].outputs.rebuilt == 'true' ||
      needs['nvidia-open-lts-meta'].outputs.rebuilt == 'true' ||
      needs.caddy.outputs.rebuilt == 'true')
    runs-on: ubuntu-latest
    container: archlinux:base

    steps:
      - name: Install mail client
        run: pacman -Syu --noconfirm --needed curl

      - uses: actions/checkout@v4

      - name: Send publication email
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          ARCHERY_BUILT_PACKAGES: |-
            amneziawg-linux-lts: ${{ needs['amneziawg-linux-lts'].outputs.rebuilt }}
            nvidia-open-lts-meta: ${{ needs['nvidia-open-lts-meta'].outputs.rebuilt }}
            caddy: ${{ needs.caddy.outputs.rebuilt }}
          ARCHERY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/send-build-email
