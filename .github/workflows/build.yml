name: Build and publish packages

on:
  push:
    paths:
      - packages/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  amneziawg-linux-lts-bin:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install build environment
        run: pacman -Syu --noconfirm --needed bc git gnupg kmod linux-lts linux-lts-headers

      - uses: actions/checkout@v4

      - name: Select current linux-lts
        run: ./scripts/prepare-linux-lts packages/amneziawg-linux-lts-bin/PKGBUILD

      - name: Build package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc \
            "cd '$GITHUB_WORKSPACE/packages/amneziawg-linux-lts-bin' && makepkg --cleanbuild --noconfirm"

      - name: Verify module metadata
        run: |
          package=$(find packages/amneziawg-linux-lts-bin -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          mkdir /tmp/package
          bsdtar -xf "$package" -C /tmp/package
          module=$(find /tmp/package/usr/lib/modules -name 'amneziawg.ko.zst' -print -quit)
          zstd -dc "$module" > /tmp/amneziawg.ko
          modinfo /tmp/amneziawg.ko

      - uses: actions/upload-artifact@v4
        with:
          name: amneziawg-linux-lts-bin
          path: packages/amneziawg-linux-lts-bin/*.pkg.tar.zst
          if-no-files-found: error

      - name: Import repository signing key
        env:
          ARCHERY_GPG_PRIVATE_KEY: ${{ secrets.ARCHERY_GPG_PRIVATE_KEY }}
        run: |
          test -n "$ARCHERY_GPG_PRIVATE_KEY"
          printf '%s' "$ARCHERY_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

      - name: Assemble signed repository
        run: |
          install -d public/x86_64
          cp packages/amneziawg-linux-lts-bin/*.pkg.tar.zst public/x86_64/

          fingerprint=$(gpg --batch --with-colons --list-secret-keys | \
            awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"

          cd public/x86_64
          for package in *.pkg.tar.zst; do
            gpg --batch --yes --local-user "$fingerprint" --detach-sign "$package"
          done
          repo-add --sign --key "$fingerprint" archery.db.tar.zst ./*.pkg.tar.zst

          # GitHub Pages artifacts cannot contain symbolic links. repo-add creates
          # archery.db and archery.files as symlinks, so publish regular copies.
          while IFS= read -r link; do
            cp --dereference "$link" "${link}.regular"
            rm "$link"
            mv "${link}.regular" "$link"
          done < <(find . -maxdepth 1 -type l -print)

          gpg --batch --armor --export "$fingerprint" > ../archery.gpg
          printf '%s\n' "$fingerprint" > ../archery.fingerprint

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: amneziawg-linux-lts-bin
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
