name: Update AmneziaWG

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version and checksum
        run: ./scripts/update-amneziawg packages/amneziawg-linux-lts-bin/PKGBUILD

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo 'Already up to date'
            exit 0
          fi

          version=$(sed -n 's/^_upstream_version=//p' packages/amneziawg-linux-lts-bin/PKGBUILD)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/amneziawg-linux-lts-bin/PKGBUILD
          git commit -m "Update AmneziaWG to ${version}"
          git push
